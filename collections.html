<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nobelian Admin - Collections</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://nobelian-be.fly.dev data:; connect-src https://nobelian-be.fly.dev; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">

<link rel="stylesheet" href="css/admin.css">
<script defer src="js/security.js"></script>
<script defer src="js/api.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/collections.js"></script>

</head>

<body>

<div class="admin-layout">

<!-- SIDEBAR -->

<aside class="sidebar">

<div class="sidebar-logo">
<h2>Nobelian</h2>
<p>Admin</p>
</div>

<nav class="sidebar-nav">

<a href="/dashboard.html" class="nav-item">
Dashboard
</a>

<a href="/products.html" class="nav-item">
Products
</a>

<a href="/collections.html" class="nav-item active">
Collections
</a>

<a href="/media.html" class="nav-item">
Media
</a>

<a href="/orders.html" class="nav-item">
Orders
</a>

</nav>

<div class="sidebar-footer">
<button id="logoutButton" class="logout-button">Logout</button>
</div>

</aside>


<!-- MAIN CONTENT -->

<div class="main-content">

<header class="topbar">
<h1>Collections</h1>
</header>


<section class="collection-create">

<h3 id="collectionFormTitle">Create Collection</h3>

<div class="form-group">
<label for="collectionName">Name</label>
<input 
type="text"
id="collectionName"
placeholder="Collection name"
maxlength="100">
</div>

<div class="form-group">
<label for="collectionSlug">Slug (optional, auto-generated if empty)</label>
<input 
type="text"
id="collectionSlug"
placeholder="e.g. art-collection"
maxlength="100"
pattern="[a-z0-9\-]*">
</div>

<div class="form-group">
<label for="collectionDescription">Description</label>
<textarea 
id="collectionDescription"
placeholder="Collection description"
rows="3"
maxlength="1000"></textarea>
</div>

<div class="form-group">
<label for="collectionCoverImage">Cover Image URL (optional)</label>
<input 
type="text"
id="collectionCoverImage"
placeholder="https://... or /cloud/..."
maxlength="500">
</div>

<div class="form-group">
<label>
<input type="checkbox" id="collectionFeatured"> Featured
</label>
</div>

<div class="form-actions">
<button id="createCollectionButton" class="create-button">
Create
</button>
<button id="cancelEditButton" class="cancel-button" style="display:none;">
Cancel
</button>
</div>

<input type="hidden" id="editCollectionId" value="">

</section>


<section class="collections-list">

<h3>Existing Collections</h3>

<table class="collections-table">

<thead>
<tr>
<th>Name</th>
<th>Slug</th>
<th>Featured</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="collectionsTable">

<tr>
<td colspan="4">Loading collections...</td>
</tr>

</tbody>

</table>

</section>

</div>

</div>

</body>
</html>
