<link rel="stylesheet" href="css/admin.css">
<script defer src="js/security.js"></script>

<script defer src="js/auth.js"></script>

<body>

<div class="admin-layout">

<!-- SIDEBAR -->

<aside class="sidebar">

<h2>Nobelian</h2>

</div>

<nav class="sidebar-nav">

</nav>

</div>

<!-- MAIN CONTENT -->

<div class="main-content">

<header class="topbar">
<h1>Collections</h1>
</header>


<section class="collection-create">

<h3>Create Collection</h3>

<input 
type="text"
id="collectionName"
placeholder="Collection name"
maxlength="100">

<button id="createCollectionButton" class="create-button">
Create
</button>

</section>


<section class="collections-list">

<h3>Existing Collections</h3>

<table class="collections-table">

<thead>
<tr>
<th>Name</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="collectionsTable">

<tr>
<td colspan="2">Loading collections...</td>
</tr>

</tbody>

</table>
