<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nobelian Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' https://assets.nobelian.com; connect-src https://nobelian-be.fly.dev; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">

  <link rel="icon" type="image/svg+xml" href="https://assets.nobelian.com/icons/nobelian_pict.svg">
  <link rel="stylesheet" href="css/admin.css">

  <script defer src="js/security.js"></script>
</head>

<body>

<div class="loading-container">
  <h1>Nobelian Admin</h1>
  <p>Loading...</p>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {

    const token = localStorage.getItem("admin_token");

    if (!token) {
      window.location.href = "/login.html";
      return;
    }

    // Validate token before redirecting to dashboard
    if (typeof TokenUtils !== "undefined") {
      if (TokenUtils.isExpired(token) || !TokenUtils.isAdmin(token)) {
        localStorage.removeItem("admin_token");
        window.location.href = "/login.html?reason=expired";
        return;
      }
    }

    window.location.href = "/dashboard.html";

  });
</script>

</body>
</html>
