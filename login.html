<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nobelian Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' https://assets.nobelian.com; connect-src https://nobelian-be.fly.dev; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">

  <link rel="icon" type="image/svg+xml" href="https://assets.nobelian.com/icons/nobelian_pict.svg">
  <link rel="stylesheet" href="css/admin.css">

  <script defer src="js/security.js"></script>
  <script defer src="js/api.js"></script>
</head>

<body>

<div class="login-container">

  <div class="login-card">

    <img src="https://assets.nobelian.com/icons/nobelian_pict.svg" alt="Nobelian Logo" class="admin-logo-img">
    <h1 class="admin-logo">Nobelian</h1>
    <p class="admin-subtitle">Admin Backoffice</p>

    <p id="sessionMessage" class="error-message"></p>

    <form id="loginForm">

      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          id="email"
          placeholder="admin@nobelian.com"
          required
          maxlength="254"
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label>Password</label>
        <input 
          type="password" 
          id="password"
          placeholder="Enter password"
          required
          maxlength="72"
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="login-button">
        Sign In
      </button>

      <p id="errorMessage" class="error-message"></p>

    </form>

  </div>

</div>

<script>

// Show session expiry/timeout messages
(function() {
  const params = new URLSearchParams(window.location.search);
  const reason = params.get("reason");
  const msgEl = document.getElementById("sessionMessage");

  if (reason === "timeout") {
    msgEl.innerText = "Session expired due to inactivity. Please log in again.";
    msgEl.style.color = "#c0392b";
  } else if (reason === "expired") {
    msgEl.innerText = "Your session has expired. Please log in again.";
    msgEl.style.color = "#c0392b";
  } else if (reason === "unauthorized") {
    msgEl.innerText = "Access denied. Admin privileges required.";
    msgEl.style.color = "#c0392b";
  }
})();


// If already logged in with valid token, redirect to dashboard
(function() {
  const token = localStorage.getItem("admin_token");
  if (token && typeof TokenUtils !== "undefined" && !TokenUtils.isExpired(token) && TokenUtils.isAdmin(token)) {
    window.location.href = "/dashboard.html";
  }
})();


document.getElementById("loginForm").addEventListener("submit", async function(e) {

  e.preventDefault();

  const errorEl = document.getElementById("errorMessage");
  errorEl.innerText = "";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  // Client-side validation
  if (!email || !password) {
    errorEl.innerText = "Email and password are required";
    return;
  }

  if (password.length > 72) {
    errorEl.innerText = "Password is too long";
    return;
  }

  try {

    const response = await fetch(`${API_BASE}/auth/login`, {

      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        email: email,
        password: password
      })

    });

    const data = await response.json();

    if (response.ok && data.token) {

      // Validate the received token before storing
      if (typeof TokenUtils !== "undefined") {
        if (TokenUtils.isExpired(data.token)) {
          errorEl.innerText = "Received invalid token from server";
          return;
        }
        if (!TokenUtils.isAdmin(data.token)) {
          errorEl.innerText = "Access denied. Admin privileges required.";
          return;
        }
      }

      localStorage.setItem("admin_token", data.token);

      window.location.href = "/dashboard.html";

    } else {

      errorEl.innerText = data.error || data.message || "Login failed";

    }

  } catch (err) {

    console.error("Login error:", err);
    errorEl.innerText = "Connection error. Please try again.";

  }

});

</script>

</body>
</html>
