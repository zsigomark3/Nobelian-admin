<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nobelian Admin - Media</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://nobelian-be.fly.dev https://assets.nobelian.com data:; connect-src https://nobelian-be.fly.dev; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">

<link rel="icon" type="image/svg+xml" href="https://assets.nobelian.com/icons/nobelian_pict.svg">
<link rel="stylesheet" href="css/admin.css">

<script defer src="js/security.js"></script>
<script defer src="js/api.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/media.js"></script>

</head>

<body>

<div class="admin-layout">

<!-- SIDEBAR -->
<aside class="sidebar">
<div class="sidebar-logo">
<h2>Nobelian</h2>
<p>Admin</p>
</div>

<nav class="sidebar-nav">
<a href="/dashboard.html" class="nav-item">Dashboard</a>
<a href="/products.html" class="nav-item">Products</a>
<a href="/collections.html" class="nav-item">Collections</a>
<a href="/media.html" class="nav-item active">Media</a>
<a href="/orders.html" class="nav-item">Orders</a>
<a href="/customers.html" class="nav-item">Customers</a>
<a href="/analytics.html" class="nav-item">Analytics</a>
</nav>

<div class="sidebar-footer">
<button id="logoutButton" class="logout-button">Logout</button>
</div>
</aside>


<!-- MAIN CONTENT -->
<div class="main-content">

<header class="topbar">
<h1>Media Library</h1>
<div class="topbar-actions">
<button id="saveOrderBtn" class="create-button" style="display:none;">Save Order</button>
</div>
</header>


<!-- Upload Section -->
<section class="media-upload">
<h3>Upload Image</h3>
<div class="upload-row">
<input type="file" id="imageFile" accept="image/jpeg,image/png,image/gif,image/webp,image/svg+xml,image/avif" multiple>
<select id="uploadFolder">
<option value="">No folder</option>
</select>
<input type="text" id="uploadNewFolder" placeholder="Or new folder name..." class="folder-input">
<input type="text" id="uploadAltText" placeholder="Alt text (optional)" class="alt-input">
<button id="uploadButton" class="upload-button">Upload</button>
</div>
<p id="uploadStatus"></p>
</section>


<!-- Folder Filter -->
<section class="media-folders">
<div class="folder-bar">
<button class="folder-tab active" data-folder="">All</button>
<button class="folder-tab" data-folder="__uncategorized__">Uncategorized</button>
<div id="folderTabs"></div>
</div>
</section>


<!-- Media Grid (drag & drop sortable) -->
<section class="media-library">
<div id="mediaGrid" class="media-grid sortable">
<p>Loading images...</p>
</div>
</section>


<!-- Edit Modal -->
<div id="editModal" class="modal-overlay" style="display:none;">
<div class="modal-card">
<h3>Edit Media</h3>
<form id="editForm">
<input type="hidden" id="editId">

<div class="form-group">
<label>Display Name</label>
<input type="text" id="editName" maxlength="255">
</div>

<div class="form-group">
<label>Alt Text</label>
<input type="text" id="editAltText" maxlength="500" placeholder="Describe the image for accessibility">
</div>

<div class="form-group">
<label>Folder</label>
<select id="editFolder">
<option value="">No folder</option>
</select>
<input type="text" id="editNewFolder" placeholder="Or new folder..." class="folder-input" style="margin-top:6px;">
</div>

<div class="form-group">
<label>Preview</label>
<img id="editPreview" class="edit-preview" alt="">
</div>

<div class="form-actions">
<button type="submit" class="save-button">Save</button>
<button type="button" id="editCancelBtn" class="cancel-button">Cancel</button>
</div>
</form>
</div>
</div>


<!-- Optimize Modal -->
<div id="optimizeModal" class="modal-overlay" style="display:none;">
<div class="modal-card">
<h3>Optimize Image</h3>
<form id="optimizeForm">
<input type="hidden" id="optimizeId">

<div class="form-group">
<label>Current</label>
<p id="optimizeInfo"></p>
<img id="optimizePreview" class="edit-preview" alt="">
</div>

<div class="form-group">
<label>Target Format</label>
<select id="optimizeFormat">
<option value="webp">WebP (recommended)</option>
<option value="jpeg">JPEG</option>
<option value="png">PNG</option>
</select>
</div>

<div class="form-group">
<label>Resize Width (px, 0 = keep original)</label>
<input type="number" id="optimizeWidth" min="0" max="4096" value="0">
</div>

<div class="form-group">
<label>Resize Height (px, 0 = keep original)</label>
<input type="number" id="optimizeHeight" min="0" max="4096" value="0">
</div>

<div class="form-group">
<label>Quality (1-100)</label>
<input type="number" id="optimizeQuality" min="1" max="100" value="80">
</div>

<div class="form-actions">
<button type="submit" class="save-button">Optimize</button>
<button type="button" id="optimizeCancelBtn" class="cancel-button">Cancel</button>
</div>
</form>
<p id="optimizeStatus"></p>
</div>
</div>

</div>

</div>

</body>
</html>
