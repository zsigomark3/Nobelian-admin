<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nobelian Admin - Media</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://nobelian-be.fly.dev https://assets.nobelian.com data:; connect-src https://nobelian-be.fly.dev; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">

<link rel="icon" type="image/svg+xml" href="https://assets.nobelian.com/icons/nobelian_pict.svg">
<link rel="stylesheet" href="css/admin.css">

<script defer src="js/security.js"></script>
<script defer src="js/api.js"></script>
<script defer src="js/auth.js"></script>
<script defer src="js/media.js"></script>

</head>

<body>

<div class="admin-layout">

<!-- SIDEBAR -->

<aside class="sidebar">

<div class="sidebar-logo">
<h2>Nobelian</h2>
<p>Admin</p>
</div>

<nav class="sidebar-nav">

<a href="/dashboard.html" class="nav-item">
Dashboard
</a>

<a href="/products.html" class="nav-item">
Products
</a>

<a href="/collections.html" class="nav-item">
Collections
</a>

<a href="/media.html" class="nav-item active">
Media
</a>

<a href="/orders.html" class="nav-item">
Orders
</a>

</nav>

<div class="sidebar-footer">
<button id="logoutButton" class="logout-button">Logout</button>
</div>

</aside>


<!-- MAIN CONTENT -->

<div class="main-content">

<header class="topbar">
<h1>Media Library</h1>
</header>


<section class="media-upload">

<h3>Upload Image</h3>

<input type="file" id="imageFile" accept="image/jpeg,image/png,image/gif,image/webp,image/svg+xml,image/avif">

<button id="uploadButton" class="upload-button">
Upload
</button>

<p id="uploadStatus"></p>

</section>


<section class="media-library">

<h3>Media Files</h3>

<div id="mediaGrid" class="media-grid">

<p>Loading images...</p>

</div>

</section>

</div>

</div>

</body>
</html>
